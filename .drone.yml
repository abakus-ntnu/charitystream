---
type: docker
kind: pipeline
name: default

steps:
  - name: setup
    image: node:26-alpine
    when:
      event: [pull_request]
    commands:
      - pnpm install

  - name: build
    image: node:26-alpine
    when:
      event: [pull_request]
    depends_on:
      - setup
    commands:
      - pnpm build

  - name: prettier
    image: node:26-alpine
    when:
      event: [pull_request]
    depends_on:
      - setup
    commands:
      - pnpm ci-prettier

  - name: lint
    image: node:26-alpine
    when:
      event: [pull_request]
    depends_on:
      - setup
    commands:
      - pnpm ci-lint
