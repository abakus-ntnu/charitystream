---
type: docker
kind: pipeline
name: default

steps:
  - name: setup
    image: node:24-alpine
    when:
      event: [pull_request]
    commands:
      - corepack enable && pnpm install

  - name: build
    image: node:24-alpine
    when:
      event: [pull_request]
    depends_on:
      - setup
    commands:
      - corepack enable && pnpm build

  - name: prettier
    image: node:24-alpine
    when:
      event: [pull_request]
    depends_on:
      - setup
    commands:
      - corepack enable && pnpm ci-prettier

  - name: lint
    image: node:24-alpine
    when:
      event: [pull_request]
    depends_on:
      - setup
    commands:
      - corepack enable && pnpm ci-lint
